name: Apply Phase 4 Ruff fixes

on:
  push:
    branches:
      - feature/phase4-source-of-truth
    paths:
      - ".github/workflows/phase4-ruff-fix.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-ruff-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase4-source-of-truth
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("src/tarkov_agent/api/source_truth.py")
          text = api.read_text()
          text = text.replace(
              "        status: ClaimStatus | None = Query(default=None),\n",
              "        status: ClaimStatus | None = None,\n",
          )
          api.write_text(text)

          service = Path("src/tarkov_agent/services/source_truth.py")
          text = service.read_text()
          text = text.replace(
              '''        for source in self._repository.list_sources(limit=10000):
              if source.status is SourceStatus.ACTIVE and source.next_review_at is not None:
                  if _aware(source.next_review_at) <= current:
                      tasks.append(
                          ReviewTask(
                              entity_type=ReviewEntityType.SOURCE,
                              entity_id=source.id,
                              label=source.name,
                              due_at=_aware(source.next_review_at),
                              severity=ReviewSeverity.IMPORTANT,
                              reason=(
                                  "Source authority, availability, and freshness are due for "
                                  "review."
                              ),
                          )
                      )
          ''',
              '''        for source in self._repository.list_sources(limit=10000):
              if (
                  source.status is SourceStatus.ACTIVE
                  and source.next_review_at is not None
                  and _aware(source.next_review_at) <= current
              ):
                  tasks.append(
                      ReviewTask(
                          entity_type=ReviewEntityType.SOURCE,
                          entity_id=source.id,
                          label=source.name,
                          due_at=_aware(source.next_review_at),
                          severity=ReviewSeverity.IMPORTANT,
                          reason=(
                              "Source authority, availability, and freshness are due for review."
                          ),
                      )
                  )
          ''',
          )
          text = text.replace(
              '''        for claim in self._repository.list_claims(limit=10000):
              if claim.status is not ClaimStatus.REJECTED and claim.next_review_at is not None:
                  if _aware(claim.next_review_at) <= current:
                      tasks.append(
                          ReviewTask(
                              entity_type=ReviewEntityType.CLAIM,
                              entity_id=claim.id,
                              label=claim.key,
                              due_at=_aware(claim.next_review_at),
                              severity=(
                                  ReviewSeverity.BLOCKING
                                  if claim.status is ClaimStatus.STALE
                                  else ReviewSeverity.ROUTINE
                              ),
                              reason="Claim citations and patch applicability are due for review.",
                          )
                      )
          ''',
              '''        for claim in self._repository.list_claims(limit=10000):
              if (
                  claim.status is not ClaimStatus.REJECTED
                  and claim.next_review_at is not None
                  and _aware(claim.next_review_at) <= current
              ):
                  tasks.append(
                      ReviewTask(
                          entity_type=ReviewEntityType.CLAIM,
                          entity_id=claim.id,
                          label=claim.key,
                          due_at=_aware(claim.next_review_at),
                          severity=(
                              ReviewSeverity.BLOCKING
                              if claim.status is ClaimStatus.STALE
                              else ReviewSeverity.ROUTINE
                          ),
                          reason="Claim citations and patch applicability are due for review.",
                      )
                  )
          ''',
          )
          service.write_text(text)
          PY
          rm .github/workflows/phase4-ruff-fix.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 4 lint findings"
          git push origin HEAD:feature/phase4-source-of-truth
