name: Apply Phase 4 mypy fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-mypy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase4-source-of-truth
      - name: Rename optional citation source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tarkov_agent/services/source_truth.py")
          lines = path.read_text().splitlines(keepends=True)
          index = next(
              i
              for i, line in enumerate(lines)
              if line.strip() == "source = sources.get(citation.source_id)"
          )
          if lines[index + 1].strip() != (
              'source_name = source.name if source is not None else "Unknown source"'
          ):
              raise RuntimeError("Unexpected source_name line")
          lines[index] = "                citation_source = sources.get(citation.source_id)\n"
          lines[index + 1:index + 2] = [
              "                source_name = (\n",
              "                    citation_source.name\n",
              "                    if citation_source is not None\n",
              '                    else "Unknown source"\n',
              "                )\n",
          ]
          path.write_text("".join(lines))
          PY
          rm .github/workflows/phase4-mypy-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 4 citation source typing"
          git push origin HEAD:feature/phase4-source-of-truth
