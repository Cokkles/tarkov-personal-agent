name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/tarkov_agent
      - name: Tests
        run: pytest --cov=tarkov_agent --cov-report=term-missing

  streamdeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          node --check streamdeck/com.cokkles.tarkov-personal-agent.sdPlugin/bin/protocol.js
          node --check streamdeck/com.cokkles.tarkov-personal-agent.sdPlugin/bin/plugin.js
          node --check streamdeck/com.cokkles.tarkov-personal-agent.sdPlugin/ui/settings.js
      - name: Stream Deck protocol tests
        run: node --test streamdeck/tests/*.test.mjs
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('streamdeck/com.cokkles.tarkov-personal-agent.sdPlugin/manifest.json', 'utf8'))"
