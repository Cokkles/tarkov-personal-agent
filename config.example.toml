# Copy this file to config.toml and update local paths.

[paths]
data_root = "~/TarkovPersonalAgent"
tarkov_log_roots = []

[process]
executable_names = [
  "EscapeFromTarkov.exe",
  "EscapeFromTarkov_BE.exe",
  "EscapeFromTarkovArena.exe",
]
poll_interval_seconds = 2.0

[logs]
file_globs = ["*.log", "*.txt"]
poll_interval_seconds = 1.0
start_at_end = true
minimum_auto_signal_confidence = 0.90

# Verified against 106 real EFT session logs (client 1.0.5 to 1.1.5). Patterns anchor on
# "|Info|application|" so the duplicate copy of each line in output_000.log is ignored.
# Raid end is the "GC mode switched to Enabled" that follows GameStarted; the state machine
# ignores that line whenever no raid is active.
[[logs.rules]]
name = "eft-matching-completed"
pattern = '\|Info\|application\|MatchingCompleted:'
signal = "raid_candidate_found"
confidence = 0.92

[[logs.rules]]
name = "eft-game-started"
pattern = '\|Info\|application\|GameStarted:'
signal = "raid_started"
confidence = 0.97

[[logs.rules]]
name = "eft-raid-exit"
pattern = '\|Info\|application\|GC mode switched to Enabled'
signal = "raid_ended"
confidence = 0.92

[obs]
enabled = false
host = "127.0.0.1"
port = 4455
password = ""
timeout_seconds = 3.0
start_recording_on_raid_start = true
stop_recording_on_raid_end = true
# Start OBS hidden in the tray when the agent starts (reuses OBS if already open).
# Enable the WebSocket server once in OBS: Tools > WebSocket Server Settings.
auto_launch = false
# Profile OBS should use (applied at launch and after connecting; never mid-recording).
profile = "OBS PPE Record"
# scene_collection = ""
# executable = "C:/Program Files/obs-studio/bin/64bit/obs64.exe"
# Record the mic on its own track (needs Advanced output mode in OBS) for re-transcription.
# mic_input_name = "Mic/Aux"
# mic_track = 2
close_on_exit = false

[api]
enabled = true
host = "127.0.0.1"
port = 8765
token = ""
open_browser = true
# Add the OBS recording folder here when it is outside data_root.
# Example: allowed_evidence_roots = ["D:/OBS Recordings"]
allowed_evidence_roots = []

[diagnostics]
default_capture_seconds = 120.0
maximum_lines = 10000

[ppe]
enabled = true
neutral_prior_weight = 1.25
confidence_weight_scale = 2.5
maximum_weight_per_raid_dimension = 1.0
minimum_report_confidence = 0.25
minimum_established_confidence = 0.50
signal_threshold = 0.20
context_difference_threshold = 0.35
minimum_independent_raids = 3
maximum_history = 200

[truth]
enabled = true
seed_default_sources = true
minimum_verification_score = 0.72
minimum_supporting_citations = 1
claim_review_interval_days = 30
source_review_interval_days = 30
stale_grace_days = 14

[recommendations]
enabled = true
minimum_plan_confidence = 0.40
maximum_history = 200

[media]
# Fixed correction in ms if markers land consistently early/late in the video.
# timing_offset_ms = 0
enabled = true
copy_recordings_into_package = false
file_stability_timeout_seconds = 30.0
file_stability_poll_seconds = 0.5
file_stability_checks = 3
ffprobe_path = "ffprobe"
ffmpeg_path = "ffmpeg"
probe_timeout_seconds = 20.0
clip_timeout_seconds = 180.0
default_clip_seconds_before = 10.0
default_clip_seconds_after = 15.0

[desktop]
enabled = true
auto_start_service = true
minimize_to_tray = true
stop_service_on_exit = true
poll_interval_seconds = 2.0
request_timeout_seconds = 1.5
service_start_timeout_seconds = 15.0

[runtime]
auto_create_raid_package = true
auto_complete_raid_on_end = false
copy_evidence_into_package = false
recover_interrupted_sessions = true
graceful_shutdown_seconds = 10.0
