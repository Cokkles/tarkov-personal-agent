[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tarkov-personal-agent"
version = "0.1.0"
description = "Local-first passive raid companion and personal playstyle analytics platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Tarkov Personal Agent contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "watchdog>=4.0,<7",
  "psutil>=6.0,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "obsws-python>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
tarkov-agent = "tarkov_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkov_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tarkov_agent"]

[[tool.mypy.overrides]]
module = ["obsws_python", "obsws_python.*"]
ignore_missing_imports = true
