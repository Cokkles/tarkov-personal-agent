[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tarkov-personal-agent"
version = "0.11.0"
description = "Local-first passive raid companion and personal playstyle analytics platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Tarkov Personal Agent contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "watchdog>=4.0,<7",
  "psutil>=6.0,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "obsws-python>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-psutil>=7.0,<8",
  "httpx>=0.27,<1",
]
desktop = [
  "PySide6>=6.8,<7",
]
desktop-build = [
  "PySide6>=6.8,<7",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
tarkov-agent = "tarkov_agent.cli:main"

[project.gui-scripts]
tarkov-agent-desktop = "tarkov_agent.desktop.app:main"
tarkov-marker = "tarkov_agent.marker_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkov_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/tarkov_agent/api/static/index.html" = "tarkov_agent/api/static/index.html"
"src/tarkov_agent/api/static/ppe.html" = "tarkov_agent/api/static/ppe.html"
"src/tarkov_agent/api/static/source_truth.html" = "tarkov_agent/api/static/source_truth.html"
"src/tarkov_agent/api/static/recommendations.html" = "tarkov_agent/api/static/recommendations.html"
"src/tarkov_agent/api/static/media.html" = "tarkov_agent/api/static/media.html"
"src/tarkov_agent/desktop/assets/operations_center_background.jpg" = "tarkov_agent/desktop/assets/operations_center_background.jpg"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tarkov_agent/ppe/registry.py" = ["E501"]
"src/tarkov_agent/desktop/qt_*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tarkov_agent"]

[[tool.mypy.overrides]]
module = ["obsws_python", "obsws_python.*", "PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tarkov_agent.desktop.qt_app", "tarkov_agent.desktop.qt_common", "tarkov_agent.desktop.qt_runtime", "tarkov_agent.desktop.qt_theme", "tarkov_agent.desktop.qt_pages", "tarkov_agent.desktop.qt_widgets"]
ignore_errors = true
